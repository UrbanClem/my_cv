description: >-
  Software Engineering student (B.S. expected 2027) and software developer with a Technical High School Diploma in Programming Analysis. Professional experience includes frontend and mobile development at YAA Internet, technical support at Compusof, and social service at Universidad de Colima's Dirección de Sistemas, where he began his web development career.

  Currently developing an AI-driven thesis project on adaptive educational content generation using locally-hosted LLMs (Ollama) to personalize mathematics learning based on individual student assessment and learning styles.

  Combines hands-on industry experience in web/mobile development, technical support (serving enterprise clients including Aeroméxico, Coppel, and Burger King), and early training in PHP/MySQL with academic research in AI personalization.

  Proficient in Python, JavaScript/TypeScript, React, React Native, PHP, SQL, and Unity (C#). Fluent in Spanish and English (TOEFL ITP C1 certified). Passionate about building intelligent, user-adaptive systems that solve real-world problems.
